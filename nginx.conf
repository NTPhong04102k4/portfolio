server {
    listen 80;
    listen [::]:80;
    server_name localhost; # Thay bằng domain của bạn (vd: example.com www.example.com)

    root /usr/share/nginx/html; # Đường dẫn tới thư mục build/source của trang web
    index index.html;

    # Gzip Compression tối ưu hiệu năng tải trang
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers bảo mật ứng dụng Web
    # Lưu ý trong Nginx: add_header ở level server sẽ bị ghi đè nếu location con cũng dùng add_header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Cấu hình Routing cho Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache cho các tài nguyên tĩnh (CSS, JS, Images, Fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Không lưu cache file index.html để đảm bảo người dùng luôn nhận bản cập nhật mới nhất
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        expires 0;
    }

    # Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # Xử lý trang lỗi 404
    error_page 404 /index.html;

    # Tránh log favicon & robots.txt không tìm thấy
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
